<div class="w-100 tls-inspecao">
    <div class="tls-veredito tls-veredito-{tls.vereditoCor} mb-3">
        <span class="material-symbols-outlined icon-animated" aria-hidden="true" translate="no">
            {#if tls.vereditoCor == 'success'}verified{#else if tls.vereditoCor == 'warning'}gpp_maybe{#else}gpp_bad{/if}
        </span>
        <div>
            <h3 class="mb-1 text-{tls.vereditoCor}">{tls.veredito}</h3>
            <p class="small text-secondary mb-0">{tls.resumo}</p>
        </div>
    </div>

    <ul class="tls-checagens">
        {#for c in tls.checagens}
        <li class="tls-checagem tls-checagem-{c.estadoCor}">
            <span class="material-symbols-outlined tls-check-icone text-{c.estadoCor}" aria-hidden="true" translate="no">{c.icone}</span>
            <div class="tls-check-corpo">
                <div class="tls-check-cabeca">
                    <span class="tls-check-nome">{c.nome}</span>
                    <span class="badge bg-dark border border-{c.estadoCor} text-{c.estadoCor}">{c.estado}</span>
                </div>
                <p class="small text-light mb-0">{c.detalhe}</p>
            </div>
        </li>
        {/for}
    </ul>
</div>
