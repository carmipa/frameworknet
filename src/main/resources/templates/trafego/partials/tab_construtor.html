<div class="aed-card card-tech loc-nota mb-4" role="note">
    <span class="material-symbols-outlined" aria-hidden="true" translate="no">info</span>
    <div>
        <strong>Modelo simulado.</strong>
        Edite os campos, gere os <strong>bytes reais</strong> do pacote (Ethernet / IPv4 / TCP-UDP,
        com comprimentos e checksums corretos) e clique em <em>Decodificar estes bytes</em> para ver
        o mesmo pacote decomposto — a ida e a volta. Nada é enviado à rede.
    </div>
</div>

<form id="form-construtor" class="trafego-form" autocomplete="off"
      hx-post="/trafego/api/construir"
      hx-target="#construtor-resultado"
      hx-swap="innerHTML"
      hx-disabled-elt="find button[type='submit']">
    <div class="row g-3">
        <div class="col-sm-4">
            <label class="form-label small text-secondary" for="c-proto"><span class="material-symbols-outlined aed-inline-icon" aria-hidden="true" translate="no">swap_horiz</span> Protocolo</label>
            <select id="c-proto" name="protocolo" class="form-select form-select-sm bg-dark text-light border-secondary">
                <option value="tcp" selected>TCP</option>
                <option value="udp">UDP</option>
            </select>
        </div>
        <div class="col-sm-4">
            <label class="form-label small text-secondary" for="c-ttl"><span class="material-symbols-outlined aed-inline-icon" aria-hidden="true" translate="no">timer</span> TTL</label>
            <input id="c-ttl" name="ttl" value="64" class="form-control form-control-sm bg-dark text-light border-secondary">
        </div>
        <div class="col-sm-4">
            <label class="form-label small text-secondary" for="c-checksum"><span class="material-symbols-outlined aed-inline-icon" aria-hidden="true" translate="no">verified</span> Checksum</label>
            <select id="c-checksum" name="checksum" class="form-select form-select-sm bg-dark text-light border-secondary">
                <option value="valido" selected>Válido (calculado)</option>
                <option value="invalido">Inválido (didático)</option>
            </select>
        </div>

        <div class="col-sm-6">
            <label class="form-label small text-secondary" for="c-ipo"><span class="material-symbols-outlined aed-inline-icon" aria-hidden="true" translate="no">call_made</span> IP de origem</label>
            <input id="c-ipo" name="ipOrigem" value="192.168.0.10" class="form-control form-control-sm bg-dark text-light border-secondary">
        </div>
        <div class="col-sm-6">
            <label class="form-label small text-secondary" for="c-ipd"><span class="material-symbols-outlined aed-inline-icon" aria-hidden="true" translate="no">call_received</span> IP de destino</label>
            <input id="c-ipd" name="ipDestino" value="203.0.113.5" class="form-control form-control-sm bg-dark text-light border-secondary">
        </div>

        <div class="col-sm-3">
            <label class="form-label small text-secondary" for="c-po"><span class="material-symbols-outlined aed-inline-icon" aria-hidden="true" translate="no">login</span> Porta origem</label>
            <input id="c-po" name="portaOrigem" value="51000" class="form-control form-control-sm bg-dark text-light border-secondary">
        </div>
        <div class="col-sm-3">
            <label class="form-label small text-secondary" for="c-pd"><span class="material-symbols-outlined aed-inline-icon" aria-hidden="true" translate="no">logout</span> Porta destino</label>
            <input id="c-pd" name="portaDestino" value="443" class="form-control form-control-sm bg-dark text-light border-secondary">
        </div>
        <div class="col-sm-3">
            <label class="form-label small text-secondary" for="c-seq"><span class="material-symbols-outlined aed-inline-icon" aria-hidden="true" translate="no">tag</span> Sequência (TCP)</label>
            <input id="c-seq" name="seq" value="1000" class="form-control form-control-sm bg-dark text-light border-secondary">
        </div>
        <div class="col-sm-3">
            <label class="form-label small text-secondary" for="c-win"><span class="material-symbols-outlined aed-inline-icon" aria-hidden="true" translate="no">aspect_ratio</span> Janela (TCP)</label>
            <input id="c-win" name="window" value="64240" class="form-control form-control-sm bg-dark text-light border-secondary">
        </div>

        <div class="col-12">
            <label class="form-label small text-secondary d-block"><span class="material-symbols-outlined aed-inline-icon" aria-hidden="true" translate="no">flag</span> Flags TCP</label>
            <div class="d-flex flex-wrap gap-3 small text-light">
                <label class="d-flex align-items-center gap-1"><span class="material-symbols-outlined" aria-hidden="true" translate="no">flag</span> <input type="checkbox" name="flags" value="SYN" checked> SYN</label>
                <label class="d-flex align-items-center gap-1"><span class="material-symbols-outlined" aria-hidden="true" translate="no">flag</span> <input type="checkbox" name="flags" value="ACK"> ACK</label>
                <label class="d-flex align-items-center gap-1"><span class="material-symbols-outlined" aria-hidden="true" translate="no">flag</span> <input type="checkbox" name="flags" value="FIN"> FIN</label>
                <label class="d-flex align-items-center gap-1"><span class="material-symbols-outlined" aria-hidden="true" translate="no">flag</span> <input type="checkbox" name="flags" value="RST"> RST</label>
                <label class="d-flex align-items-center gap-1"><span class="material-symbols-outlined" aria-hidden="true" translate="no">flag</span> <input type="checkbox" name="flags" value="PSH"> PSH</label>
            </div>
        </div>

        <div class="col-12">
            <label class="form-label small text-secondary" for="c-msg"><span class="material-symbols-outlined aed-inline-icon" aria-hidden="true" translate="no">notes</span> Mensagem / payload (opcional)</label>
            <input id="c-msg" name="mensagem" value="" placeholder="ex.: GET / HTTP/1.1"
                   class="form-control form-control-sm bg-dark text-light border-secondary">
        </div>
    </div>
    <div class="d-flex flex-wrap gap-2 mt-3">
        <button type="submit" class="aed-btn aed-btn-teal"
                title="Montar os bytes do pacote a partir dos campos">
            <span class="spinner-border spinner-border-sm htmx-indicator" role="status" aria-hidden="true"></span>
            <span class="material-symbols-outlined" aria-hidden="true" translate="no">construction</span> Gerar pacote
        </button>
        <button type="button" class="aed-btn aed-btn-neutral" data-limpar
                title="Esvaziar os campos e apagar o resultado">
            <span class="material-symbols-outlined" translate="no" aria-hidden="true">delete_sweep</span> Limpar
        </button>
    </div>
</form>

<div id="construtor-resultado" aria-live="polite"></div>
