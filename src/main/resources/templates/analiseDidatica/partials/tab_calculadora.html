<div class="row g-3">
    <div class="col-lg-5">
        <p class="calc-hint mb-3">
            Divisão rápida de um bloco em sub-redes de tamanho fixo. Um <code translate="no">/21</code> em <code translate="no">/24</code>
            dá <strong>8</strong> redes. Para plano de VLANs, sumarização e faixa para CIDR, use a
            <a href="/calculadora">Calculadora completa</a>.
        </p>

        <form id="formCalcAnalise"
              hx-post="/calculadora/api/dividir"
              hx-target="#saidaCalcAnalise"
              hx-swap="innerHTML"
              hx-disabled-elt="find button[type='submit']">
            <input type="hidden" name="criterio" value="prefixo">

            <div class="mb-3">
                <label for="calcAnaliseBloco" class="form-label small text-secondary"><span class="material-symbols-outlined" aria-hidden="true" translate="no">lan</span> Bloco base</label>
                <input type="text" name="bloco" id="calcAnaliseBloco"
                       class="form-control input-ipv4 bg-dark text-light border-secondary"
                       placeholder="Ex.: 192.168.0.0/21" value="192.168.0.0/21"
                       inputmode="text" autocomplete="off" spellcheck="false" required>
            </div>

            <div class="row g-2 align-items-end">
                <div class="col-6">
                    <label for="calcAnalisePrefixo" class="form-label small text-secondary"><span class="material-symbols-outlined" aria-hidden="true" translate="no">tag</span> Prefixo alvo</label>
                    <input type="text" name="prefixoAlvo" id="calcAnalisePrefixo"
                           class="form-control input-cidr bg-dark text-light border-secondary"
                           inputmode="numeric" maxlength="2" placeholder="24" value="24" required>
                </div>
                <div class="col-6">
                    <button type="submit" class="aed-btn aed-btn-execute w-100"
                            title="Calcular quantas sub-redes cabem e listar cada uma">
                        <span class="spinner-border spinner-border-sm htmx-indicator" role="status" aria-hidden="true"></span>
                        <span class="material-symbols-outlined" translate="no" aria-hidden="true">play_arrow</span> Calcular
                    </button>
                </div>
            </div>
        </form>
    </div>

    <div class="col-lg-7">
        <div id="saidaCalcAnalise" class="calc-saida">
            <div class="calc-placeholder">
                <span class="material-symbols-outlined" aria-hidden="true" translate="no">calculate</span>
                <p class="mb-0">Informe o bloco e o prefixo alvo para ver quantas redes cabem.</p>
            </div>
        </div>
    </div>
</div>
