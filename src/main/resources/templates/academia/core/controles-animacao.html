{! Controles da parte "Ver" de uma lição (INV-ACAD-007): tocar/pausar, passo, recomeçar e
   velocidade, mais a legenda que fala em aria-live. Ligados pelo motor.js por data-acad-*. !}
<div class="acad-controles" role="group" aria-label="Controles da animação">
    <button type="button" class="aed-btn aed-btn-teal btn-sm" data-acad-acao="tocar">
        <span class="material-symbols-outlined" aria-hidden="true" translate="no">play_arrow</span>
        <span data-acad-rotulo>Tocar</span>
    </button>
    <button type="button" class="aed-btn aed-btn-neutral btn-sm" data-acad-acao="passo"
            title="Avança um passo e pausa, para ler com calma">
        <span class="material-symbols-outlined" aria-hidden="true" translate="no">skip_next</span>
        <span>Passo</span>
    </button>
    <button type="button" class="aed-btn aed-btn-neutral btn-sm" data-acad-acao="reiniciar">
        <span class="material-symbols-outlined" aria-hidden="true" translate="no">restart_alt</span>
        <span>Recomeçar</span>
    </button>
    <label for="acad-velocidade">
        <span class="material-symbols-outlined" aria-hidden="true" translate="no">speed</span>
        <span>Velocidade</span>
    </label>
    <span>
        <select id="acad-velocidade" class="form-select form-select-sm" data-acad-velocidade title="Escolha devagar para ler cada passo com calma, ou rápida para rever a animação" aria-label="Velocidade da animação">
            <option value="0.5">devagar</option>
            <option value="1" selected>normal</option>
            <option value="2">rápida</option>
        </select>
    </span>
</div>
<p class="acad-legenda-passo" data-acad-legenda aria-live="polite"></p>
