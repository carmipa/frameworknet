quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Tetos de entrada (auditoria de 01/10/2026: SEC-07/CALC-03 e OPS-04).
# Campo de formulario: o padrao do Quarkus e 2048 bytes (contado no texto CODIFICADO) e devolvia 413
# para uso normal — Engenharia reversa com 3 roteadores, turma acima de ~55 alunos, quadro Ethernet
# cheio no Decodificador (1514 B = 3028 caracteres hex). 256K cobre o maior que o site promete:
# 65535 bytes de quadro em hex com separador (~196K) e os 200 alunos de InputLimits.
quarkus.http.limits.max-form-attribute-size=256K
# Corpo inteiro: o padrao de 10M deixava qualquer POST pesar 10 MB na memoria antes do rate limit
# (o filtro de CSRF le o corpo). Nenhuma tela envia mais que um campo grande e alguns pequenos.
quarkus.http.limits.max-body-size=1M

# Compressão só de JS e CSS estáticos: o globo 3D local (SEC-05) tem 2,0 MB e cai para ~580 KB em gzip.
# HTML e JSON ficam de FORA de propósito: levam token de CSRF e dado do visitante junto de texto que o
# cliente escolhe, e comprimir isso abre o ataque BREACH (medir o tamanho para adivinhar o segredo).
quarkus.http.enable-compression=true
quarkus.http.compress-media-types=text/javascript,application/javascript,text/css

# Dev: ignora chaves legadas (ex.: -Dframework.app.open-browser) após migração para framework.dev.*
%dev.smallrye.config.mapping.validate-unknown=false

# Dev: abre o navegador automaticamente ao iniciar (quarkusDev)
%dev.framework.dev.open-browser=true
%dev.framework.dev.browser-path=/

# Framework de Redes
framework.app.max-history=60
framework.app.comparador-cidr-padrao-a=20
framework.app.comparador-cidr-padrao-b=24
framework.dns.cache-ttl-seconds=180
framework.dns.resolve-timeout-seconds=3
framework.geo.cache-ttl-seconds=300

# Cache L2 (Redis) das respostas de API externa — GeoIP e Nominatim.
# Desligado por padrão: em dev e nos testes não há Redis, e o cache em memória
# (L1) continua funcionando sozinho. Em produção o docker-compose liga via
# FRAMEWORK_CACHE_DISTRIBUIDO_ENABLED e aponta QUARKUS_REDIS_HOSTS.
framework.cache.distribuido-enabled=false
# Impede o Quarkus de exigir Redis no boot quando o cache está desligado.
quarkus.redis.health.enabled=false
# Cache e janela de telemetria sao opcionais: esperar 10 s (padrao) por um Redis pendurado prendia a
# requisicao. 2 s e o disjuntor do CacheDistribuido limitam o custo de uma queda (OPS-17).
quarkus.redis.timeout=2s
# Sem isto o Quarkus tenta subir um Redis por Testcontainers em dev/teste — e a
# suíte quebra inteira em máquina sem Docker.
quarkus.redis.devservices.enabled=false

# Calculadora de sub-redes e VLANs — tetos de RENDERIZAÇÃO.
# Um /8 dividido em /30 dá 4.194.304 sub-redes: os limites evitam travar o navegador.
# O total matemático continua sendo calculado e exibido, com aviso de truncamento.
framework.calculadora.max-linhas=512
framework.calculadora.max-vlans=256
framework.calculadora.max-redes-agregacao=64

# Localização (ViaCEP + geocoding OpenStreetMap/Nominatim)
framework.localizacao.viacep-url=https://viacep.com.br/ws
framework.localizacao.nominatim-url=https://nominatim.openstreetmap.org/search
framework.localizacao.user-agent=FrameworkNetRedes/1.0 (didatico; +https://github.com/carmipa)
framework.localizacao.cache-ttl-seconds=86400
framework.localizacao.http-timeout-seconds=5
# Politica do Nominatim: 1 req/s no total. Chamada que chega no mesmo segundo espera o proximo slot
# ate este teto (o fallback cidade/UF do CEP depende disso); alem dele devolve "sem coordenadas".
framework.localizacao.nominatim-espera-maxima-ms=1200

# Academia (/academia): desligada responde 503 só nas rotas dela; o estado sai no log do arranque.
framework.academia.enabled=true

# Logs e telemetria compartilhada (pasta local para exportação)
framework.logs.base-dir=logs
framework.telemetry.enabled=true
framework.telemetry.dashboard-enabled=true
framework.telemetry.max-events=5000
framework.telemetry.jsonl-max-bytes=10485760

# Segurança
framework.security.csrf-enabled=true
framework.security.csrf-secret=framework-net-dev-csrf-secret-change-in-prod
framework.security.sensitive-apis-enabled=true
framework.security.rate-limit-enabled=true
framework.security.rate-limit-per-minute=120
framework.security.rate-limit-heavy-per-minute=30
# Teto por cliente somando todas as rotas (sem ele o total por IP era limite x numero de rotas).
framework.security.rate-limit-global-per-minute=600
framework.security.admin-api-key=dev-admin-key-local
framework.security.admin-api-key-required=true
# Marca cookies (CSRF/admin) como Secure — deixe false em dev (HTTP), true em prod (HTTPS)
framework.security.cookie-secure=false

# Headers de segurança HTTP
quarkus.http.header.X-Content-Type-Options.value=nosniff
quarkus.http.header.X-Frame-Options.value=SAMEORIGIN
quarkus.http.header.Referrer-Policy.value=strict-origin-when-cross-origin
quarkus.http.header.Permissions-Policy.value=geolocation=(self), microphone=(), camera=()

# Area autenticada e telas de entrada: fora do indice pelo CABECALHO, e nao pelo robots.txt.
# O robots.txt e publico (listar caminho privado nele e entregar o mapa) e, se a rota estivesse
# em Disallow, o robo nunca buscaria a resposta e nunca leria este noindex.
quarkus.http.filter.area-privada.header."X-Robots-Tag"=noindex, nofollow
quarkus.http.filter.area-privada.matches=/(admin|login|telemetria)(/.*)?

# Content-Security-Policy — origens externas enumeradas a partir dos templates e
# do JS do projeto (2026-08-03): fonts.googleapis/gstatic (fontes de TEXTO); o esm.sh saiu (globo 3D local, SEC-05)
# e, em 22/10/2026, jsdelivr e unpkg tambem: Bootstrap, mermaid, Chart.js e Leaflet sao servidos pelo proprio
# site (web/vendor, bytes conferidos contra o SRI),
# tile.openstreetmap (mapa) e o widget do Google Translate.
#
# LIMITE CONHECIDO: script-src carrega 'unsafe-inline' porque há blocos <script>
# inline nos templates e o callback do Google Translate depende disso. Com
# 'unsafe-inline' o CSP NÃO barra XSS refletido — a proteção que resta, e que é
# real, é impedir carregamento e exfiltração para origem desconhecida, além de
# object-src/base-uri/form-action. Remover o inline dos templates é o passo que
# transforma este CSP em defesa contra XSS de verdade.
#
# As origens abaixo foram confirmadas em NAVEGADOR REAL (scripts/verificar-csp.mjs),
# não por leitura dos templates. Duas só apareceram assim, porque o servidor
# responde 200 mesmo quando o browser bloqueia o recurso:
#   - translate-pa.googleapis.com : o widget do Google Translate busca a lista de
#     idiomas aí; sem a origem, a tradução para de funcionar em todas as páginas
#   - cdn.jsdelivr.net em img-src  : o globo 3D carrega texturas (earth-blue-marble,
#     clouds, earth-topology) do mesmo CDN de onde vem o script
#   - (01/10/2026, medido com a página TRADUZINDO) o widget do Google Translate pede
#     www.google.com/images/cleardot.gif e o pixel translate.google.com/gen204 (que o
#     navegador promove de http para https em página https), e monta um <iframe> com
#     endereço do próprio site ('self' em frame-src). Sem isso, cada página traduzida
#     enchia o console de violação de CSP. As bandeiras do seletor de idioma passaram
#     a ser servidas pelo próprio site; as de país da GeoIP viraram emoji local (FRONT-18) e o
#     flagcdn saiu do img-src.
# Ao mexer neste CSP, rode: node scripts/verificar-csp.mjs
quarkus.http.header.Content-Security-Policy.value=default-src 'self'; script-src 'self' 'unsafe-inline' https://translate.google.com https://translate.googleapis.com https://translate-pa.googleapis.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://www.gstatic.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.gstatic.com https://translate.googleapis.com https://translate.google.com https://www.google.com; connect-src 'self' https://*.tile.openstreetmap.org https://translate.googleapis.com https://translate-pa.googleapis.com; frame-src 'self' https://translate.googleapis.com; frame-ancestors 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'
quarkus.application.name=framework-net-java-quarkus
quarkus.application.version=1.0.0-SNAPSHOT
# Log em ARQUIVO desligado de propósito (padrão do Quarkus 3, agora explícito): o log vai para o
# stdout e o Docker rotaciona (docker-compose.yml: 3 x 10 MB). Ligar o arquivo duplicaria I/O no
# volume e faria o console do painel reler até 10 MB a cada atualização. As linhas abaixo só valem
# se alguém ligar o arquivo conscientemente (ex.: dev sem Docker).
quarkus.log.file.enabled=false
quarkus.log.file.path=logs/framework-net.log
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=5
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) req=%X{request.id} trace=%X{trace.id} %s%e%n

# GeoIP MaxMind (opcional: colocar GeoLite2-City.mmdb em src/main/resources/geo/)
framework.geo.database-path=geo/GeoLite2-City.mmdb

# --- Acesso à Telemetria: login pelo GitHub (OAuth 2.0) ---
# Em dev fica vazio: sem credencial, o botão do GitHub não é oferecido e resta a
# contingência com a chave administrativa. Em produção os valores vêm do .env.
framework.security.github-oauth.client-id=${GITHUB_OAUTH_CLIENT_ID:}
framework.security.github-oauth.client-secret=${GITHUB_OAUTH_CLIENT_SECRET:}
framework.security.github-oauth.logins-permitidos=${GITHUB_OAUTH_LOGINS_PERMITIDOS:}
framework.security.github-oauth.callback-url=${GITHUB_OAUTH_CALLBACK_URL:}

# --- Sincronizacao do dataset publico com o GitHub ---
# Token fine-grained com escopo Contents:write em UM unico repositorio.
# Optional no codigo: ausente = botao desabilitado, aplicacao sobe normal.
framework.dataset.github.token=${GITHUB_DATASET_TOKEN:}
framework.dataset.github.repositorio=${GITHUB_DATASET_REPO:carmipa/framework-net-telemetry-dataset}
framework.dataset.github.branch=${GITHUB_DATASET_BRANCH:main}

# --- Janela de telemetria em Redis Stream ---
# Camada de LEITURA: amplia a janela do painel sem inchar o heap e sobrevive ao
# restart do container. A fonte duravel continua sendo o JSONL em disco.
framework.telemetry.stream.enabled=true
framework.telemetry.stream.chave=framework-net:telemetria
framework.telemetry.stream.max-len=50000
# Quantos eventos o painel, o dataset e a exportacao leem do Stream (era o max-events da memoria,
# 500). O painel mostra a cobertura real e avisa quando o periodo pedido passa dela (OPS-05).
framework.telemetry.stream.janela-leitura=5000
